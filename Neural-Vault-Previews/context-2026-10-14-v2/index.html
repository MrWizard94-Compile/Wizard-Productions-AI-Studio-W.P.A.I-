brokenFromSeed":{"wiki":0,"markdown":0}};
    const vaultRoot = "C:\\WPAI";
    const svg = document.getElementById("graph");
    const list = document.getElementById("list");
    const details = document.getElementById("details");
    const filter = document.getElementById("filter");
    const NS = "http://www.w3.org/2000/svg";
    const evidence = new Map(model.edges.map(edge => [edge.id, edge]));
    const outerRing = Math.max(0, Math.ceil((model.nodes.length - 1) / 8) - 1);
    const extent = 560 + outerRing * 470 + 170;
    svg.setAttribute("viewBox", [-extent, -extent, extent * 2, extent * 2].join(" "));
    let selected = model.seed;
    const positions = new Map([[model.seed, {x: 0, y: 0}]]);
    model.nodes.slice(1).forEach((node, index) => {
      const ring = Math.floor(index / 8);
      const inRing = index % 8;
      const count = Math.min(8, model.nodes.length - 1 - ring * 8);
      const angle = -Math.PI / 2 + 2 * Math.PI * inRing / count;
      const radius = 560 + ring * 470;
      positions.set(node.id, {x: Math.cos(angle) * radius, y: Math.sin(angle) * radius});
    });
    function updateSnapshotAge() {
      const elapsedMs = Math.max(0, Date.now() - Date.parse(model.builtAt));
      const ageMinutes = Math.floor(elapsedMs / 60000);

        " · source-index freshness bound at export: " + model.freshnessBoundMs / 1000 +
        " s · read-only; rerun the exporter to refresh";
    }
    updateSnapshotAge();
    setInterval(updateSnapshotAge, 60000);
    function svgElement(name, attributes) {

      for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
      return element;
    }
    function showDetails(id) {
      selected = id;
      details.replaceChildren();
      const node = model.nodes.find(item => item.id === id);
      const heading = document.createElement("h2"); heading.textContent = id; details.append(heading);
      const score = document.createElement("p"); score.className = "meta";
      score.textContent = id === model.seed ? "Selected seed" : "Activation weight: " + node.activation + " (ranking, not probability)";
      details.append(score);
      const open = document.createElement("a");

      open.textContent = "Open source note in Obsidian";

      const title = document.createElement("h3"); title.textContent = "Why this note is here"; details.append(title);
      if (id === model.seed) {
        const note = document.createElement("p"); note.textContent = "This note seeded the neighborhood."; details.append(note);

      for (const evidenceId of node.evidenceIds) {

      const visible = model.nodes.filter(node => node.id.toLocaleLowerCase().includes(term) || node.id === model.seed);
      const ids = new Set(visible.map(node => node.id));
      svg.replaceChildren(); list.replaceChildren();
      for (const edge of model.edges) {
        if (!ids.has(edge.from) || !ids.has(edge.to)) continue;
        const from = positions.get(edge.from), to = positions.get(edge.to);

          class: edge.authored ? "edge-authored" : "edge-inferred"}));
      }
      for (const node of visible) {
        const pos = positions.get(node.id);
        const authored = node.evidenceIds.some(id => evidence.get(id).authored);

        const label = svgElement("text", {x: pos.x, y: pos.y + 5});
        const name = node.id.split("/").pop();
        label.textContent = name.length > 19 ? name.slice(0, 17) + "…" : name;
        group.append(label);
        group.addEventListener("click", () => showDetails(node.id));
        group.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") {event.preventDefault(); showDetails(node.id);} });
        svg.append(group);
        const button = document.createElement("button"); button.type = "button";
        button.dataset.id = node.id;
        button.textContent = node.id + (node.id === model.seed ? " · seed" : " · " + node.activation);
